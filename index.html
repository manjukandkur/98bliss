<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="98 Bliss"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>98 Bliss Visitors</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<base target="_top">
<script>window.onerror = function (m, s, l, c) { try { var d = document.createElement("div"); d.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99;background:#b00020;color:#fff;padding:10px;font:13px monospace"; var sc = [].slice.call(document.scripts).sort(function (a, b) { return b.text.length - a.text.length; })[0]; var ln = sc ? sc.text.split("\n") : []; d.textContent = "Page error: " + m + " (line " + l + ":" + c + ") >> " + (ln[l - 2] || "").slice(0, 140) + " || " + (ln[l - 1] || "").slice(Math.max(0, c - 60), c + 20); (document.body || document.documentElement).appendChild(d); } catch (e) {} };</script>
<script src="config.js"></script><script src="app.js"></script>
<style>
:root{--ink:#14213d;--bg:#f4f5f7;--card:#fff;--muted:#6b7280;--line:#e5e7eb;--ok:#1a7f37;--warn:#b35c00;--bad:#b00020;--acc:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px 0}
header h1{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
header h1 small{font-weight:400;font-size:13px;opacity:.8}
header h1 a{color:#fff;font-size:13px;opacity:.85}
nav{display:flex;gap:4px}
nav button{flex:1;background:transparent;border:0;color:#cbd5e1;padding:10px 4px 12px;font-size:15px;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:#fca311;font-weight:600}
main{padding:14px 16px 90px;max-width:640px;margin:0 auto}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.types button{padding:14px 4px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:15px;font-weight:600;color:var(--ink)}
.types button span{display:block;font-size:24px;margin-bottom:2px}
.types button.on{border-color:var(--acc);background:#eef2ff}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:17px;background:#fff;color:var(--ink)}
textarea{min-height:70px;font-size:16px}
.big{font-size:22px;letter-spacing:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.known{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:10px 12px;margin-top:10px;display:flex;gap:10px;align-items:center}
.known img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#ddd}
.known.bad{background:#fef2f2;border-color:#fecaca;color:var(--bad)}
.known small{color:var(--muted);display:block}
.photo{display:flex;gap:10px;align-items:center}
.photo label.btn{margin:0;flex:1;text-align:center;padding:14px;border:2px dashed #94a3b8;border-radius:12px;color:var(--ink);font-size:15px;background:#fff}
.photo img{width:70px;height:70px;object-fit:cover;border-radius:10px;display:none}
.go{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.go button{width:100%;max-width:608px;display:block;margin:0 auto;padding:16px;border:0;border-radius:14px;background:var(--ok);color:#fff;font-size:19px;font-weight:700}
.go button:disabled{opacity:.5}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;gap:12px}
.card img{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#e5e7eb;flex:none}
.card .t{flex:1;min-width:0}
.card b{display:block;font-size:17px}
.card small{color:var(--muted);display:block}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#e0e7ff;color:#3730a3;margin-right:4px}
.tag.Delivery{background:#fef3c7;color:#92400e}.tag.Maintenance{background:#dcfce7;color:#166534}
.out{margin-top:8px}
.out button{padding:10px 16px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:600}
.out textarea{margin:8px 0}
.out .big-out{width:100%;padding:14px;font-size:17px}
.out .opt{display:flex;gap:16px;margin-top:8px;font-size:13.5px}.out .opt a{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.hide{display:none!important}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;display:none;max-width:90%}
#toast.err{background:var(--bad)}
.when{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.when button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;color:var(--ink)}
.when button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.when input{width:auto;flex:1;min-width:190px;padding:8px;font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.card.late{border:2px solid #fecaca}.card .red{color:var(--bad);font-weight:700;display:block;margin-top:4px}
#regulars button{background:#ecfdf5;border-color:#a7f3d0}
.sugg{border:1px solid #cbd5e1;border-radius:12px;background:#fff;margin-top:6px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eef2f7;background:#fff;padding:10px 12px;font-size:15px;color:var(--ink)}
.sugg button:last-child{border-bottom:0}
.sugg button small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sugg button.old{background:#fef2f2}.sugg button.old b{color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.tag.cur{background:#dcfce7;color:#166534}
.wk{margin-top:6px;font-size:13.5px;line-height:1.45}.wk b{display:block;margin-bottom:2px}
.starBtn{margin-top:6px;border:1px solid #86efac;background:#fff;color:#166534;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}.tag.in{background:#dbeafe;color:#1e40af}
</style>
</head>
<body>
<header>
  <h1><span><span id="house"></span> Visitors</span> <small id="who"></small></h1>
  <nav>
    <button data-tab="new" class="on">New visitor</button>
    <button data-tab="inside">Inside <span id="nIn"></span></button>
    <button data-tab="today">Today</button>
  </nav>
</header>
<div id="toast"></div>

<main id="tab-new">
  <div class="types">
    <button data-type="Visitor" class="on"><span>🙋</span>Visitor</button>
    <button data-type="Delivery"><span>📦</span>Delivery</button>
    <button data-type="Maintenance"><span>🔧</span>Service</button>
  </div>

  <div id="f-regulars" class="hide"><label>Regulars — one tap</label><div class="chips" id="regulars"></div></div>

  <label>Mobile number</label>
  <input id="mobile" class="big" type="tel" inputmode="numeric" autocomplete="off" placeholder="10-digit mobile">
  <div id="suggM" class="sugg hide"></div>
  <div id="known" class="known hide"></div>

  <label>Name</label>
  <input id="person_name" autocomplete="off" placeholder="Type a name, shop or trade to find a repeat person">
  <div id="suggN" class="sugg hide"></div>

  <div id="f-company">
    <label id="l-company">Company</label>
    <input id="company" autocomplete="off">
  </div>

  <div id="f-delivery" class="hide">
    <label>Courier</label>
    <div class="chips" id="courier"></div>
    <div class="row">
      <div><label>Parcels</label><input id="parcel_count" type="number" inputmode="numeric" value="1"></div>
      <div><label>Received by</label><input id="received_by"></div>
    </div>
  </div>

  <div id="f-service" class="hide">
    <label>Work type</label>
    <select id="trade"><option value="">— choose —</option></select>
    <label>For which job (if booked)</label>
    <select id="service_job"><option value="">— none / walk-in —</option></select>
  </div>

  <label id="l-meeting">Meeting / for whom</label>
  <input id="meeting" autocomplete="off">

  <label>Purpose / problem</label>
  <input id="purpose" autocomplete="off">

  <label>People</label><input id="people_count" type="number" inputmode="numeric" value="1" style="max-width:120px">

  <label>Came in</label>
  <div class="when" id="cameIn"><button type="button" data-v="" class="on">Now</button><button type="button" data-v="15">15 min ago</button><button type="button" data-v="30">30 min ago</button><button type="button" data-v="60">1 h ago</button><button type="button" data-v="pick">Pick time</button></div>
  <input id="cameAt" type="datetime-local" class="hide" style="margin-top:6px">
  <div class="hint" id="whoHint"></div>

  <label>Photo</label>
  <div class="photo">
    <label class="btn" for="photoIn">📷 Take photo</label>
    <input id="photoIn" type="file" accept="image/*" capture="environment" class="hide">
    <img id="photoPrev" alt="">
  </div>

  <div class="go"><button id="save">Check in</button></div>
</main>

<main id="tab-inside" class="hide"><div id="insideList"></div></main>
<main id="tab-today" class="hide"><div id="todayList"></div></main>

<script type="text/plain" id="main">
(() => {
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COURIERS = BOOT.couriers;
$("house").textContent = BOOT.house;
$("who").innerHTML = esc(BOOT.name + (BOOT.staff_role && BOOT.staff_role !== BOOT.name ? " · " + BOOT.staff_role : "")) +
  (BOOT.role === "owner" || BOOT.role === "manager" ? ` · <a href="${BOOT.url}?k=${BOOT.k}&p=owner">Owner page</a>` : "");
$("whoHint").textContent = "Entered by " + BOOT.name + (BOOT.staff_role && BOOT.staff_role !== BOOT.name ? " (" + BOOT.staff_role + ")" : "");
$("trade").innerHTML += BOOT.trades.map((t) => `<option>${esc(t)}</option>`).join("");
let type = "Visitor", courier = "", known = null, autoType = false;

// Google Apps Script bridge: every call carries this link's key; the server checks it.
function call(fn, ...args) { return window.appCall(fn, args); }
function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.className = bad ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), bad ? 5000 : 2500);
}
const fmt = (s) => s ? new Date(s.replace(" ", "T") + "+05:30").toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
function since(s) {
  const m = Math.max(0, Math.round((Date.now() - new Date(s.replace(" ", "T") + "+05:30")) / 60000));
  return m < 60 ? m + " min" : m < 1440 ? Math.floor(m / 60) + " h " + (m % 60) + " min" : Math.floor(m / 1440) + " d " + Math.floor((m % 1440) / 60) + " h";
}
// IST 'yyyy-MM-ddTHH:mm' for a datetime-local input
const istLocal = (ms) => new Date(ms + 5.5 * 3600e3).toISOString().slice(0, 16);

// ---- tabs
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => showTab(b.dataset.tab));
function showTab(t) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  ["new", "inside", "today"].forEach((x) => $("tab-" + x).classList.toggle("hide", x !== t));
  if (t === "inside") loadInside();
  if (t === "today") loadToday();
}

// ---- entry type
document.querySelectorAll(".types button").forEach((b) => b.onclick = () => { autoType = false; setType(b.dataset.type); });
function setType(t) {
  type = t;
  document.querySelectorAll(".types button").forEach((b) => b.classList.toggle("on", b.dataset.type === t));
  $("f-delivery").classList.toggle("hide", t !== "Delivery");
  $("f-service").classList.toggle("hide", t !== "Maintenance");
  $("l-company").textContent = t === "Maintenance" ? "Company / shop" : "Company";
  $("f-company").classList.toggle("hide", t === "Delivery");
  $("l-meeting").textContent = t === "Delivery" ? "Parcel for" : t === "Maintenance" ? "Called by" : "Meeting / for whom";
  if (t === "Maintenance") loadJobs();
}
$("courier").innerHTML = COURIERS.map((c) => `<button type="button">${c}</button>`).join("");
$("courier").onclick = (e) => {
  if (e.target.tagName !== "BUTTON") return;
  courier = courier === e.target.textContent ? "" : e.target.textContent;
  [...$("courier").children].forEach((b) => b.classList.toggle("on", b.textContent === courier));
};

// ---- came in: now / minutes ago / picked time
let cameIn = "";
$("cameIn").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  [...$("cameIn").children].forEach((x) => x.classList.toggle("on", x === b));
  cameIn = b.dataset.v;
  $("cameAt").classList.toggle("hide", cameIn !== "pick");
  if (cameIn === "pick" && !$("cameAt").value) { $("cameAt").value = istLocal(Date.now() - 3600e3); $("cameAt").max = istLocal(Date.now()); }
};

async function loadJobs() {
  try {
    const jobs = await call("openJobs");
    $("service_job").innerHTML = '<option value="">— none / walk-in —</option>' +
      jobs.map((j) => `<option value="${esc(j.id)}" data-trade="${esc(j.trade || "")}">${esc(j.subject)}${j.vendor_name ? " — " + esc(j.vendor_name) : ""}</option>`).join("");
  } catch (e) {}
}
$("service_job").onchange = () => {
  const o = $("service_job").selectedOptions[0];
  if (o && o.dataset.trade) $("trade").value = o.dataset.trade;
};

// ---- regulars: one tap fills the number (and the rest fills itself)
async function loadRegulars() {
  try {
    const r = await call("regulars");
    $("f-regulars").classList.toggle("hide", !r.length);
    $("regulars").innerHTML = r.map((x) => `<button type="button" data-m="${esc(x.mobile)}">${esc(x.name)}</button>`).join("");
  } catch (e) {}
}
$("regulars").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $("mobile").value = b.dataset.m; $("mobile").dispatchEvent(new Event("input")); };

// ---- repeat people: type part of a name or number -> tap the person -> everything fills in
let suggSeq = 0, suggTimer = null;
function hideSugg() { ["suggM", "suggN"].forEach((id) => { $(id).className = "sugg hide"; $(id).innerHTML = ""; }); }
function askSugg(boxId, q) {
  clearTimeout(suggTimer);
  suggTimer = setTimeout(async () => {
    const mine = ++suggSeq;
    let list = [];
    try { list = await call("suggest", q); } catch (e) { list = []; }
    if (mine !== suggSeq) return; // an older, slower answer never overwrites the newer one
    hideSugg();
    if (!list.length) return;
    $(boxId).className = "sugg";
    $(boxId).innerHTML = list.map((p) => `<button type="button" data-m="${esc(p.mobile)}" class="${p.replaced || p.dnc || p.notinuse ? "old" : ""}">
      <b>${esc(p.name)}${p.replaced ? " — REPLACED" : p.dnc ? " — DO NOT CALL" : p.notinuse ? " — NOT IN USE" : ""}</b>${p.current ? '<span class="tag cur">⭐ CURRENT</span>' : ""}${p.inside ? '<span class="tag in">INSIDE NOW</span>' : ""}
      <small>${esc([p.mobile.replace(/(\d{5})(\d{5})/, "$1 $2"), p.company, p.trade].filter(Boolean).join(" · "))}</small>
      <small>${p.last ? "Last came " + fmt(p.last) + (p.work ? " — " + esc(p.work) : "") : p.src === "contacts" ? "From house contacts — not come through the gate yet" : "Not come through the gate yet"}</small></button>`).join("");
  }, 250);
}
function pickSugg(e) {
  const b = e.target.closest("button[data-m]"); if (!b) return;
  hideSugg();
  $("mobile").value = b.dataset.m;
  $("mobile").dispatchEvent(new Event("input"));
}
$("suggM").onclick = pickSugg;
$("suggN").onclick = pickSugg;
$("person_name").addEventListener("input", () => {
  const q = $("person_name").value.trim();
  if (known || q.replace(/[^A-Za-z]/g, "").length < 2) { hideSugg(); return; }
  askSugg("suggN", q);
});

// ---- mobile lookup: a known person fills themselves in
$("mobile").addEventListener("input", async () => {
  const d = $("mobile").value.replace(/\D/g, "");
  if (d.length >= 4 && d.length < 10) askSugg("suggM", d); else { clearTimeout(suggTimer); suggSeq++; hideSugg(); }
  if (d.length < 10) { if (known) clearKnown(); return; }
  try {
    const r = await call("lookup", d.slice(-10));
    if (!r.found) { clearKnown(); return; }
    known = r;
    $("person_name").value = r.person_name || "";
    $("company").value = r.company || "";
    if (r.trade) $("trade").value = r.trade;
    const before = type;
    if (["Visitor", "Delivery", "Maintenance"].includes(r.category)) setType(r.category);
    else if (r.last && ["Visitor", "Delivery", "Maintenance"].includes(r.last.type)) setType(r.last.type);
    else if (r.fromContacts && r.trade) setType("Maintenance"); // a house contact with a trade word in the name = service person
    autoType = autoType || type !== before;
    if (r.trade) $("trade").value = r.trade; else if (r.last && r.last.trade) $("trade").value = r.last.trade;
    if (r.last) { // repeat visit: carry forward what is usually the same; never overwrite what the guard typed
      if (!$("meeting").value && r.last.meeting) $("meeting").value = r.last.meeting;
      if (r.last.people && Number(r.last.people) > 1 && $("people_count").value === "1") $("people_count").value = r.last.people;
    }
    const last = r.visits[0];
    const bad = r.rating === "Do not call again" || !!r.replaced;
    $("known").className = "known" + (bad ? " bad" : "");
    $("known").innerHTML = (r.photo ? `<img src="${esc(r.photo)}" alt="">` : "") +
      `<div><b>${r.replaced ? "⚠️ OWNER REPLACED THIS PERSON on " + new Date(r.replaced.on + "T12:00:00+05:30").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) + (r.replaced.by_name ? " with " + esc(r.replaced.by_name) : "") + " — ask before letting in" : bad ? "⚠️ OWNER SAYS: DO NOT CALL AGAIN — ask before letting in" : (r.fromContacts ? "In owner's contacts: " : "Known: ") + esc(r.person_name)}</b>${r.current ? '<span class="tag cur">⭐ CURRENT</span>' : ""}${r.inside_now ? '<span class="tag in">INSIDE NOW</span>' : ""}
       <small>${esc([r.company, r.trade].filter(Boolean).join(" · "))}</small>
       <small>${last ? "Last came " + fmt(last.check_in) + (last.work_done ? " — " + esc(last.work_done) : "") : "First visit through the app"}</small>
       ${(r.works || []).length ? `<div class="wk"><b>🔧 Pending works for him (${r.works.length}):</b>${r.works.map((w) => `<div>• ${esc([w.place, w.subject].filter(Boolean).join(" — "))}${w.priority === "Urgent" ? " <b style='color:#b91c1c'>URGENT</b>" : ""}</div>`).join("")}</div>` : ""}
       ${!bad && !r.fromContacts ? `<button type="button" class="starBtn" data-cur="${esc(d.slice(-10))}" data-on="${r.current ? "" : "1"}">${r.current ? "Remove ⭐ current" : "⭐ Make current"}</button>` : ""}</div>`;
  } catch (e) { clearKnown(); }
});
$("known").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-cur]"); if (!b) return;
  b.disabled = true;
  try {
    await call("setCurrent", b.dataset.cur, !!b.dataset.on);
    toast(b.dataset.on ? "⭐ Marked current — everyone sees it" : "✓ No longer current");
    $("mobile").dispatchEvent(new Event("input")); // redraw with the new badge
  } catch (err) { toast(err.message, 1); b.disabled = false; }
});
function clearKnown() {
  const wasAuto = autoType; autoType = false;
  known = null; $("known").className = "known hide"; $("known").innerHTML = "";
  if (wasAuto) setType("Visitor"); // the type came from a picked person, not from the guard - undo it with the person
}

// ---- photo (shrunk on the phone: 800px kept in Drive, 120px thumbnail kept in the sheet for the screens)
let photoData = "", thumbData = "";
$("photoIn").onchange = async () => {
  const f = $("photoIn").files[0]; if (!f) return;
  photoData = await shrink(f, 800, 0.72);
  thumbData = await shrink(f, 120, 0.6);
  $("photoPrev").src = photoData; $("photoPrev").style.display = "block";
};
function shrink(file, max, q) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => res("");
    img.src = URL.createObjectURL(file);
  });
}

// ---- save
$("save").onclick = async () => {
  const mobile = $("mobile").value.replace(/\D/g, "");
  const name = $("person_name").value.trim();
  if (mobile.length < 10) return toast("Enter the 10-digit mobile number", 1);
  if (!name) return toast("Enter the name", 1);
  if (type === "Maintenance" && !$("trade").value && !$("service_job").value) return toast("Choose the work type", 1);
  if (cameIn === "pick" && !$("cameAt").value) return toast("Pick the time they came in", 1);
  $("save").disabled = true; $("save").textContent = "Saving…";
  try {
    const data = {
      entry_type: type, mobile, person_name: name,
      company: type === "Delivery" ? "" : $("company").value.trim(),
      meeting: $("meeting").value.trim(), purpose: $("purpose").value.trim(),
      people_count: $("people_count").value || 1,
      came_in: cameIn === "pick" ? $("cameAt").value : cameIn,
    };
    if (type === "Delivery") Object.assign(data, { courier, parcel_count: $("parcel_count").value, received_by: $("received_by").value.trim() });
    if (type === "Maintenance") Object.assign(data, { trade: $("trade").value, job_id: $("service_job").value });
    if (photoData) Object.assign(data, { photo: photoData, thumb: thumbData });
    await call("checkIn", data);
    toast("✓ " + name + " checked in");
    resetForm();
    refreshCount(); loadRegulars();
  } catch (e) {
    toast(e.message, 1);
  } finally {
    $("save").disabled = false; $("save").textContent = "Check in";
  }
};
function resetForm() {
  hideSugg();
  ["mobile", "person_name", "company", "meeting", "purpose", "received_by"].forEach((id) => ($(id).value = ""));
  $("people_count").value = 1; $("parcel_count").value = 1; $("trade").value = ""; $("service_job").value = "";
  courier = ""; [...$("courier").children].forEach((b) => b.classList.remove("on"));
  photoData = ""; thumbData = ""; $("photoIn").value = ""; $("photoPrev").style.display = "none";
  cameIn = ""; [...$("cameIn").children].forEach((x, i) => x.classList.toggle("on", i === 0)); $("cameAt").value = ""; $("cameAt").classList.add("hide");
  clearKnown(); setType("Visitor"); window.scrollTo(0, 0); // mainly a visitor app: every new entry starts on Visitor
}

// ---- inside now: check out with an approximate time
async function loadInside() {
  const rows = await call("inside");
  $("nIn").textContent = rows.length ? "(" + rows.length + ")" : "";
  $("insideList").innerHTML = rows.length ? rows.map((r) => `
    <div class="card ${r.earlier_day ? "late" : ""}" id="c-${esc(r.id)}">
      ${r.photo ? `<img src="${esc(r.photo)}" alt="">` : `<img alt="">`}
      <div class="t">
        <span class="tag ${esc(r.entry_type)}">${r.entry_type === "Maintenance" ? "Service" : esc(r.entry_type)}</span>
        <b>${esc(r.person_name)}</b>
        <small>${esc([r.company || r.courier, r.trade, r.meeting && "for " + r.meeting].filter(Boolean).join(" · "))}</small>
        <small>In at ${fmt(r.check_in)}${r.in_approx ? " (approx)" : ""} · ${since(r.check_in)} ago${r.registered_by ? " · by " + esc(r.registered_by) : ""}</small>
        ${r.earlier_day ? `<span class="red">Not checked out — when did they leave?</span>` : ""}
        <div class="out">
          <button data-out="${esc(r.id)}" class="big-out">Check out${r.earlier_day ? "" : " now"}</button>
          <div class="opt">${r.entry_type === "Maintenance" ? `<a href="#" data-shownote="${esc(r.id)}">+ Note of work done</a>` : ""}${r.earlier_day ? "" : `<a href="#" data-showleft="${esc(r.id)}">Left earlier?</a>`}</div>
          ${r.entry_type === "Maintenance" ? `<textarea class="hide" placeholder="What work was done? (optional)" id="w-${esc(r.id)}"></textarea>` : ""}
          <div class="${r.earlier_day ? "" : "hide"}" id="lw-${esc(r.id)}"><label style="margin-top:4px">Left</label>
          <div class="when" data-left="${esc(r.id)}">
            ${r.earlier_day ? "" : `<button type="button" data-v="" class="on">Now</button><button type="button" data-v="30">30 min ago</button><button type="button" data-v="60">1 h ago</button><button type="button" data-v="120">2 h ago</button>`}
            <button type="button" data-v="pick" class="${r.earlier_day ? "on" : ""}">Pick time</button>
          </div>
          <input type="datetime-local" id="t-${esc(r.id)}" class="${r.earlier_day ? "" : "hide"}" style="margin:6px 0" min="${esc(r.check_in.replace(" ", "T").slice(0, 16))}" max="${istLocal(Date.now())}"></div>
        </div>
      </div>
    </div>`).join("") : '<div class="empty">Nobody inside right now.</div>';
}
const leftChoice = {};
$("insideList").onclick = async (e) => {
  const opt = e.target.closest("[data-shownote],[data-showleft]");
  if (opt) {   // check-out stays one tap; note and "left earlier" only when wanted (owner 28 Sep: minimal, anyone can do it)
    e.preventDefault();
    if (opt.dataset.shownote) { const t = $("w-" + opt.dataset.shownote); t.classList.remove("hide"); t.focus(); }
    else $("lw-" + opt.dataset.showleft).classList.remove("hide");
    opt.remove();
    return;
  }
  const chip = e.target.closest(".when button");
  if (chip) {
    const box = chip.parentElement, id = box.dataset.left;
    [...box.children].forEach((x) => x.classList.toggle("on", x === chip));
    leftChoice[id] = chip.dataset.v;
    $("t-" + id).classList.toggle("hide", chip.dataset.v !== "pick");
    return;
  }
  const n = e.target.dataset && e.target.dataset.out; if (!n) return;
  const w = $("w-" + n);
  const late = $("c-" + n).classList.contains("late");
  const choice = leftChoice[n] !== undefined ? leftChoice[n] : (late ? "pick" : "");
  const leftAt = choice === "pick" ? $("t-" + n).value : choice;
  if (choice === "pick" && !leftAt) return toast("Pick roughly when they left", 1);
  e.target.disabled = true;
  try {
    await call("checkOut", n, w ? w.value.trim() : "", leftAt);
    toast("✓ Checked out"); delete leftChoice[n]; loadInside();
  } catch (err) { toast(err.message, 1); e.target.disabled = false; }
};
async function refreshCount() { try { const r = await call("inside"); $("nIn").textContent = r.length ? "(" + r.length + ")" : ""; } catch (e) {} }

// ---- today
async function loadToday() {
  const rows = await call("today");
  $("todayList").innerHTML = rows.length ? rows.map((r) => `
    <div class="card"><div class="t">
      <span class="tag ${esc(r.entry_type)}">${r.entry_type === "Maintenance" ? "Service" : esc(r.entry_type)}</span>
      <b>${esc(r.person_name)}</b>
      <small>${esc(r.company || r.courier || "")}</small>
      <small>In ${fmt(r.check_in)}${r.in_approx ? "~" : ""}${r.check_out ? " · Out " + fmt(r.check_out) + (r.out_approx ? "~" : "") : " · still inside"}${r.registered_by ? " · by " + esc(r.registered_by) : ""}</small>
      ${r.work_done ? `<small>Work: ${esc(r.work_done)}</small>` : ""}
    </div></div>`).join("") : '<div class="empty">No entries today yet.</div>';
}

refreshCount(); loadRegulars();
setInterval(refreshCount, 60000);
})();
</script>
</body>
</html>
