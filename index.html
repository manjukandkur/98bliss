<style>
:root{--ink:#14213d;--bg:#f4f5f7;--card:#fff;--muted:#6b7280;--line:#e5e7eb;--ok:#1a7f37;--warn:#b35c00;--bad:#b00020;--acc:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
header h1{margin:0 0 8px;font-size:19px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 10px}
header h1 small{font-weight:400;font-size:13px;opacity:.8}
header h1 a{color:#fff;font-size:13px;opacity:.9;white-space:nowrap}
header h1 small{white-space:normal;text-align:right}
nav button{min-width:0;white-space:nowrap}
.ask{display:flex;gap:8px}.ask input{flex:1}.ask button{border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;padding:0 16px;font-size:16px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.sugg button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:7px 11px;font-size:14px;color:var(--ink)}
.ans{background:#eef2ff;border:1px solid #c7d2fe;border-radius:14px;padding:12px;margin-top:12px}
.ans .q{color:var(--muted);font-size:12px;margin-bottom:6px}.ans p{margin:6px 0}
.ans .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.ans .acts a{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);text-decoration:none;font-size:14px}
.ans .acts a.call{background:var(--ok);color:#fff;border-color:var(--ok)}
.who .chosen{display:flex;align-items:center;gap:8px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-weight:600}.who .chosen button{margin-left:auto;border:0;background:#fff;border-radius:999px;width:30px;height:30px;font-size:16px}.who .wl{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:260px;overflow:auto}.who .wl button{text-align:left;border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;color:inherit}.who .wl small{color:#6b7280;display:block;font-size:12.5px}.who .wl button.co{background:#eff6ff;border-color:#bfdbfe}.who .wnewp{margin-top:8px;border:1px dashed #94a3b8;background:#f8fafc;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600;color:#1d4ed8;width:100%}.who .npadd{width:100%;margin-top:8px;border:0;border-radius:10px;background:#1d4ed8;color:#fff;font-weight:700;padding:11px;font-size:15px}.who .np{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:8px 10px}.who .np input,.who .np select{margin-top:6px}.who .np{display:none;margin-top:6px}.who.adding .np{display:block}.who .whint{font-size:12px;color:#6b7280;margin-top:4px}
.alld{display:block;text-align:center;margin:14px 0;padding:12px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--acc);font-weight:600;text-decoration:none}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:transparent;border:0;color:#cbd5e1;padding:10px 11px 12px;font-size:15px;border-bottom:3px solid transparent}
nav button.hide{display:none}
nav button.on{color:#fff;border-bottom-color:#fca311;font-weight:600}
main{padding:14px 16px 90px;max-width:640px;margin:0 auto}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.types button{padding:14px 4px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:15px;font-weight:600;color:var(--ink)}
.types button span{display:block;font-size:24px;margin-bottom:2px}
.types button.on{border-color:var(--acc);background:#eef2ff}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:17px;background:#fff;color:var(--ink)}
textarea{min-height:70px;font-size:16px}
.big{font-size:22px;letter-spacing:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card .t{flex:1;min-width:0}

.empty{color:var(--muted);text-align:center;padding:40px 0}
.hide{display:none!important}

.when{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.when button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;color:var(--ink)}
.when button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.when input{width:auto;flex:1;min-width:190px;padding:8px;font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.card.late{border:2px solid #fecaca}.card .red{color:var(--bad);font-weight:700;display:block;margin-top:4px}
#regulars button{background:#ecfdf5;border-color:#a7f3d0}
.sugg{border:1px solid #cbd5e1;border-radius:12px;background:#fff;margin-top:6px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eef2f7;background:#fff;padding:10px 12px;font-size:15px;color:var(--ink)}
.sugg button:last-child{border-bottom:0}

.sugg button.old{background:#fef2f2}.sugg button.old b{color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}

.wk{margin-top:6px;font-size:13.5px;line-height:1.45}.cow{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 10px;margin-top:8px}.wk b{display:block;margin-bottom:2px}
.starBtn{margin-top:6px;border:1px solid #86efac;background:#fff;color:#166534;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}.tag.in{background:#dbeafe;color:#1e40af}
.seg{display:flex;background:#e5e7eb;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-size:15px;color:var(--ink)}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.wnew{width:100%;padding:12px;border:2px dashed #94a3b8;border-radius:12px;background:#fff;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:8px}
#worksBox .chips{margin:8px 0 0}
.wgrp{background:var(--card);border-radius:14px;padding:10px 12px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.06)}

.wgrp h4 a,.wgrp h4 button{font-size:13px;font-weight:600;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:4px 10px;color:var(--ink);text-decoration:none;white-space:nowrap}
.wrow{border-top:1px solid var(--line);padding:8px 0}
.wrow b{font-size:15.5px}.wrow .pl{color:var(--muted);font-size:13px;margin-left:4px}
.pri{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;background:#fee2e2;color:#991b1b}.pri.High{background:#ffedd5;color:#9a3412}.pri.Low{background:#e5e7eb;color:#374151}
.wait{font-size:13px;color:var(--warn);margin-top:3px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#e5e7eb}
.wacts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.wacts button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:8px 12px;font-size:14px;color:var(--ink)}
.wacts button.ok{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));position:relative}
.sheet .close{position:absolute;right:10px;top:8px;border:0;background:#f1f5f9;border-radius:999px;width:34px;height:34px;font-size:20px}
.sheet h3{margin:4px 40px 6px 0}
.sheet .save{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--ok);color:#fff;font-size:17px;font-weight:700}
.wphoto{display:flex;gap:10px;align-items:center}.wphoto label.pbtn{margin:0;flex:1;text-align:center;padding:12px;border:2px dashed #94a3b8;border-radius:12px;color:var(--ink);font-size:15px}
.wphoto img{width:60px;height:60px;object-fit:cover;border-radius:10px;display:none}
.callbtn{display:inline-block;margin:4px 0 2px;padding:6px 14px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700;font-size:14px;text-decoration:none}
.rpt{display:flex!important;align-items:center;gap:8px;margin-top:12px;font-weight:600}.rpt input{width:22px;height:22px;margin:0}.rptBox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:8px 10px;margin-top:6px}.rptBox input[type=number]{margin-top:8px}.rptTag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#ecfeff;color:#155e75;font-size:12px;font-weight:600}
.billbtn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:10px;padding:8px 10px;font-size:14px;margin:4px 4px 0 0}
</style>
</head>
<body>
<header>
  <h1><span><span id="house"></span> Visitors</span> <small id="who"></small></h1>
  <nav>
    <button data-tab="new" class="on">New visitor</button>
    <button data-tab="inside">Inside <span id="nIn"></span></button>
    <button data-tab="today">Today</button>

    <button data-go="who" class="hide xgo">Who to call</button>
    <button data-go="now" class="hide xgo">Now</button>
    <button data-go="jobs" class="hide xgo">Works</button>
    <button data-go="amc" class="hide xgo">AMC</button>
    <button data-go="mail" class="hide xgo">Mail</button>
    <button data-go="money" class="hide xgo gom">Money</button>

</header>

<main id="tab-new">

    <button data-type="Visitor" class="on"><span>🙋</span>Visitor</button>

  <div id="f-regulars" class="hide"><label>Regulars — one tap</label><div class="chips" id="regulars"></div></div>

<script type="text/plain" id="main">
(() => {
const $ = (id) => document.getElementById(id);
// 1 Oct 2026 "slight lag": each list shows its last-seen copy at once, then the fresh one from Google replaces it.
const lastCopy = (name, v) => { try { const key = "bliss98_c_" + String(BOOT.k).slice(-12) + "_" + name;
  if (v === undefined) return JSON.parse(localStorage.getItem(key) || "null"); localStorage.setItem(key, JSON.stringify(v)); } catch (e) { return null; } };
const billBtn = (b, label) => b ? `<button class="billbtn" data-bill='${esc(JSON.stringify({ thread: b.thread, name: b.name }))}'>📎 ${esc(label || "Bill")}</button>` : "";
async function openBill(b) {
  const w = window.open("", "_blank");
  if (w) w.document.write("<p style='font:16px sans-serif;padding:20px'>Opening the document…</p>");
  try {
    const f = await call("billFile", b.thread, b.name);
    const bytes = Uint8Array.from(atob(f.data), (c) => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: f.type }));
    if (w) w.location.href = url; else { const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.download = f.name; a.click(); }
  } catch (err) { if (w) w.close(); toast(err.message, 1); }
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// ---- 🔁 periodic works (1 Oct 2026): "an option to select periodical ... 1 month, 2 months or enter number of days ... if checked
// only, or else it is understood it is one time" (purifiers every 3-4 months, softener / DG batteries every 6 months...)
const RPT = [[30, "1 month"], [61, "2 months"], [91, "3 months"], [122, "4 months"], [182, "6 months"], [365, "1 year"]];
const repeatBlock = (v, withDate) => `<label class="rpt"><input type="checkbox" data-rpt ${v.repeat_days ? "checked" : ""}> 🔁 Periodical — it repeats</label>
  <div class="rptBox ${v.repeat_days ? "" : "hide"}"><div class="chips">${RPT.map(([n, l]) => `<button type="button" data-rd="${n}" class="${Number(v.repeat_days) === n ? "on" : ""}">${l}</button>`).join("")}</div>
  <input name="repeat_days" type="number" inputmode="numeric" min="1" max="3650" placeholder="or type the number of days, e.g. 100" value="${esc(v.repeat_days || "")}">
  ${withDate ? `<label>Next due on</label><input type="date" name="scheduled_on" value="${esc(v.scheduled_on || "")}">` : ""}
  <div class="hint muted" style="font-size:12px">When it is marked done, the next one is made by itself with its due date and goes on the 98 Bliss House calendar as a reminder.</div></div>`;
function initRepeat(form) {
  const cb = form.querySelector("[data-rpt]"); if (!cb) return;

// +91 / 91 / a leading 0 are dropped, so "+91 98450 12345" and "098450 12345" both work (1 Oct 2026)
function mobDigits(v) { const s = String(v || "").trim(); let x = s.replace(/\D/g, ""); if (/^\+\s*91/.test(s) || (x.length > 10 && x.startsWith("91"))) x = x.slice(2); else if (x.length === 11 && x.startsWith("0")) x = x.slice(1); return x.slice(0, 10); }
$("mobile").addEventListener("input", async () => {
  const d = mobDigits($("mobile").value);
  if (d.length >= 4 && d.length < 10) askSugg("suggM", d); else { clearTimeout(suggTimer); suggSeq++; hideSugg(); }
  if (d.length < 10) { if (known) clearKnown(); return; }
  try {
    const r = await call("lookup", d.slice(-10));
    if (!r.found) { clearKnown(); return; }
    known = r; $("coWorks").classList.add("hide");
    $("person_name").value = r.person_name || "";
    $("company").value = r.company || "";
    if (r.trade) $("trade").value = r.trade;
    const before = type;
    if (["Visitor", "Delivery", "Maintenance"].includes(r.category)) setType(r.category);
    else if (r.last && ["Visitor", "Delivery", "Maintenance"].includes(r.last.type)) setType(r.last.type);
    else if (r.fromContacts && r.trade) setType("Maintenance"); // a house contact with a trade word in the name = service person
    autoType = autoType || type !== before;
    if (r.trade) $("trade").value = r.trade; else if (r.last && r.last.trade) $("trade").value = r.last.trade;
    if (r.last) { // repeat visit: carry forward what is usually the same; never overwrite what the guard typed
      if (!$("meeting").value && r.last.meeting) $("meeting").value = r.last.meeting;
      if (r.last.people && Number(r.last.people) > 1 && $("people_count").value === "1") $("people_count").value = r.last.people;
    }
    const last = r.visits[0];
    const bad = r.rating === "Do not call again" || !!r.replaced;
    $("known").className = "known" + (bad ? " bad" : "");
    $("known").innerHTML = (r.photo ? `<img src="${esc(r.photo)}" alt="">` : "") +
      `<div><b>${r.replaced ? "⚠️ OWNER REPLACED THIS PERSON on " + new Date(r.replaced.on + "T12:00:00+05:30").toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) + (r.replaced.by_name ? " with " + esc(r.replaced.by_name) : "") + " — ask before letting in" : bad ? "⚠️ OWNER SAYS: DO NOT CALL AGAIN — ask before letting in" : (r.fromContacts ? "In owner's contacts: " : "Known: ") + esc(r.person_name)}</b>${r.current ? '<span class="tag cur">⭐ CURRENT</span>' : ""}${r.inside_now ? '<span class="tag in">INSIDE NOW</span>' : ""}
       <small>${esc([r.company, r.trade].filter(Boolean).join(" · "))}</small>
       <small>${last ? "Last came " + fmt(last.check_in) + (last.work_done ? " — " + esc(last.work_done) : "") : "First visit through the app"}</small>
       ${(r.works || []).length ? `<div class="wk"><b>🔧 Pending works for him (${r.works.length}):</b>${r.works.map((w) => `<div>• ${esc([w.place, w.subject].filter(Boolean).join(" — "))}${w.company ? " <small>(" + esc(w.company) + ")</small>" : w.given_to ? " <small>(given to " + esc(w.given_to) + ")</small>" : !w.company && w.trade ? " <small>(any " + esc(w.trade.toLowerCase()) + ")</small>" : ""}${w.priority === "Urgent" ? " <b style='color:#b91c1c'>URGENT</b>" : ""}</div>`).join("")}</div>` : ""}
       ${!bad && !r.fromContacts ? `<button type="button" class="starBtn" data-cur="${esc(d.slice(-10))}" data-on="${r.current ? "" : "1"}">${r.current ? "Remove ⭐ current" : "⭐ Make current"}</button>` : ""}</div>`;

let photoData = "", thumbData = "";
$("photoIn").onchange = async () => {

function shrink(file, max, q) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => res("");
    img.src = URL.createObjectURL(file);
  });
}

    <datalist id="wPlaces">${(W ? W.places : []).map((p) => `<option>${esc(p)}</option>`).join("")}</datalist>
    <label>What is the work?</label><input name="subject" value="${esc(v.subject || "")}" placeholder="e.g. Health faucet leaking" required>
    <label>Who does it</label>${whoPicker(v.vendor_key, v.vendor_name || vendorName(v.vendor_key, vendors), v.vendor_company, v.vendor_key || v.vendor_company ? "" : v.trade)}
    <div class="row"><div><label>Priority</label><select name="priority">${opts(["Urgent", "High", "Normal", "Low"], v.priority || "Normal")}</select></div>
    <div><label>Status</label><select name="status">${opts(["Open", "Scheduled", "In Progress", "Done", "Cancelled"], v.status || "Open")}</select></div></div>
    <label>Waits for (do these first)</label><select name="depends_on" multiple size="3">${(W ? W.jobs : []).filter((j) => j.id !== v.id && OPEN.includes(j.status)).map((j) => `<option value="${esc(j.id)}" ${(v.depends_on || []).includes(j.id) ? "selected" : ""}>${esc([j.place, j.subject].filter(Boolean).join(" — "))}</option>`).join("")}</select>
    <div class="hint">Leave empty if it can start now.</div>
    <label>Photo${v.id ? " (adds one more)" : " of the problem"}</label>
    <div class="wphoto"><label class="pbtn" for="wPhotoIn">📷 Add photos (camera or gallery — several at once)</label><input id="wPhotoIn" type="file" accept="image/*" multiple class="hide"></div><div class="thumbs" id="wPhotoPrevs"></div>
    ${repeatBlock(v, true)}
    <label>Details (optional)</label><textarea name="description">${esc(v.description || "")}</textarea>
    <button class="save" type="submit">Save</button></form>`);
  initWho(document.querySelector("#wForm [data-who]"));
  initRepeat($("wForm"));
  $("wPhotoIn").onchange = async () => { const box = $("wPhotoPrevs"); box.innerHTML = ""; for (const f of [...$("wPhotoIn").files].slice(0, 8)) { const i = document.createElement("img"); i.src = await shrink(f, 200, 0.6); box.appendChild(i); } };
  $("wForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const fd = Object.fromEntries(new FormData(ev.target).entries());
    fd.depends_on = [...ev.target.depends_on.selectedOptions].map((x) => x.value).join(", ");
    { const re = repeatCheck(ev.target, fd); if (re) return toast(re, 1); }
    if (!ev.target.querySelector("[data-rpt]").checked || !fd.scheduled_on) delete fd.scheduled_on;   // the date box belongs to the periodic part
    if (v.id) fd.id = v.id;
    const fs = $("wPhotoIn").files;
    const btn = ev.target.querySelector(".save"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      if (fs.length) fd.photos = await shrinkAll(fs);   // medium pictures (about 1000 px) + small previews
      await call("saveJob", fd); toast("✓ Saved"); closeSheet(); loadWorks();
    } catch (err) { toast(err.message, 1); btn.disabled = false; btn.textContent = "Save"; }
  };
}
$("tab-today").addEventListener("click", async (e) => {
  const t = e.target.closest("[data-wform],[data-wedit],[data-jst],[data-addph],[data-wph],[data-whist]"); if (!t) return;
  if (t.dataset.wform) { const g = t.dataset.grp || "", f = (W ? W.jobs : []).find((j) => j.group === g) || {};
    return workForm({ vendor_key: g && !/^(co|tr):/.test(g) ? g : "", vendor_name: f.vendor_name || "", vendor_company: g.startsWith("co:") || (g && !/^(co|tr):/.test(g)) ? f.vendor_company || "" : "", trade: g.startsWith("tr:") ? g.slice(3) : "", place: t.dataset.pl || "" }); }
  if (t.dataset.wedit) return workForm((W ? W.jobs : []).find((j) => j.id === t.dataset.wedit) || {});
  if (t.dataset.addph) { wAddFor = t.dataset.addph; $("wAddPh").value = ""; $("wAddPh").click(); return; }
  if (t.dataset.whist) {
    const g = t.dataset.whist;
    const js = W.jobs.filter((j) => j.group === g || (g.startsWith("co:") && j.vendor_company && "co:" + j.vendor_company.trim().toLowerCase().replace(/\s+/g, " ") === g) || (!/^(co|tr):/.test(g) && j.done_by === g)).sort((a, b) => String(b.completed_on || b.reported_on).localeCompare(String(a.completed_on || a.reported_on)));
    const f = W.jobs.find((j) => j.group === g) || {};
    return openSheet(`<h3>${esc(f.group_title || (js[0] ? js[0].done_by_name : ""))} — all works</h3>` + js.map((j) => `<div class="wrow"><b>${esc(j.subject)}</b><span class="pl">${esc(j.place)}</span>
      <small style="display:block;color:var(--muted)">${esc(j.status)}${j.status === "Done" ? " " + dd(j.completed_on) + (j.done_by_name ? " by " + esc(j.done_by_name) : "") : " · reported " + dd(j.reported_on)}${j.work_done ? " — " + esc(String(j.work_done).split("\n").pop()) : ""}</small></div>`).join(""));
  }
  if (t.dataset.wph) {
    openSheet('<div class="empty">Loading photo…</div>');
    try { const src = await call("workPhoto", t.dataset.job, t.dataset.wph); openSheet(`<img src="${esc(src)}" style="width:100%;border-radius:12px;margin-top:30px" alt="">`); } catch (err) { openSheet(`<div class="empty">${esc(err.message)}</div>`); }
    return;
  }
  if (t.dataset.jst === "Done") { const j = (W ? W.jobs : []).find((x) => x.id === t.dataset.id); if (j) return doneSheet(j, loadWorks); }
  if (t.dataset.jst) {
    t.disabled = true;
    try { const r = await call("setJobStatus", t.dataset.id, t.dataset.jst, ""); toast(t.dataset.jst === "Done" ? doneToast(r) : "✓ Updated"); loadWorks(); }
    catch (err) { toast(err.message, 1); t.disabled = false; }
  }
});
async function shrinkAll(files) {   // several photos at once (28 Sep 2026), 8 per work at most
  const out = [];
  for (const f of [...files].slice(0, 8)) out.push({ photo: await shrink(f, 1000, 0.72), thumb: await shrink(f, 140, 0.6) });
  return out;
}
$("wAddPh").onchange = async () => {
  const fs = $("wAddPh").files; if (!fs.length || !wAddFor) return;
  toast("Uploading " + fs.length + " photo" + (fs.length > 1 ? "s" : "") + "…");
  try { const ps = await shrinkAll(fs); await call("addWorkPhoto", wAddFor, ps.map((p) => p.photo), ps.map((p) => p.thumb), ""); toast("✓ " + ps.length + " photo" + (ps.length > 1 ? "s" : "") + " added"); loadWorks(); }
  catch (err) { toast(err.message, 1); }
};

refreshCount(); loadRegulars(); worksCount();
{ const m = location.hash.match(/t=(\w+)/); if (m && ["new", "inside", "today", "ask"].indexOf(m[1]) >= 0 && !(m[1] === "ask" && !BOOT.full)) showTab(m[1]); }
setInterval(refreshCount, 60000);
})();
</script>
</body>
